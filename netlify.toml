[build]
  publish = "dist"
  command = "npm run build"

# 301 Permanent Redirects from legacy subdomain to new custom domain
[[redirects]]
  from = "https://caseshift.netlify.app/*"
  to = "https://caseconverters.in/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://caseshift.netlify.app/*"
  to = "https://caseconverters.in/:splat"
  status = 301
  force = true

# HTTP Security Headers for SEO & Security Best Practices
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cache-Control = "public, max-age=0, must-revalidate"

# Cache static immutable assets (JS, CSS, images, webmanifest, fonts)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=86400"

